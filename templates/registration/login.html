<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · WMS TechStock</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 45px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
        }
        .logo {
            text-align: center;
            font-size: 3.5em;
            margin-bottom: 10px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 30px;
        }
        .field {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #34495e;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #dfe6e9;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #5568d3;
        }
        .error {
            background: #ffe5e5;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85em;
            margin-bottom: 18px;
            border-left: 4px solid #e74c3c;
        }
        .footer {
            text-align: center;
            color: #95a5a6;
            font-size: 0.8em;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">📦</div>
        <h1>WMS TechStock</h1>
        <p class="subtitle">Sistema de Gestión de Almacenes</p>

        {% if form.errors %}
            <div class="error">
                Usuario o contraseña incorrectos. Intenta de nuevo.
            </div>
        {% endif %}

        {% if next %}
            <div class="error">
                Debes iniciar sesión para acceder a esa página.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="field">
                <label for="id_username">Usuario</label>
                <input type="text" name="username" id="id_username"
                       placeholder="Tu nombre de usuario" autofocus required>
            </div>

            <div class="field">
                <label for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password"
                       placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <div class="footer">
            Universidad Politécnica Estatal del Carchi
        </div>
    </div>
</body>
</html>
